<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <defs>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-violet" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 34px; fill: #ffffff; }
    .accent-text { fill: #00C4CC; filter: url(#glow-cyan); }
    .subtitle-text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #8B5CF6; letter-spacing: 4px; }
    
    @keyframes lineDraw {
      0% { stroke-dashoffset: 800; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -800; }
    }
    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 0 2px #00C4CC44); }
      50% { filter: drop-shadow(0 0 10px #00C4CCaa); }
    }

    .cyber-line {
      stroke: #00C4CC;
      stroke-width: 1.5;
      stroke-dasharray: 200 600;
      animation: lineDraw 6s infinite linear;
      opacity: 0.8;
      filter: url(#glow-cyan);
    }
    .sec-line {
      stroke: #8B5CF6;
      stroke-width: 0.5;
      opacity: 0.3;
    }
    .title-group {
      animation: logoPulse 4s infinite ease-in-out;
    }
  </style>

  <!-- Top and Bottom subtle borders -->
  <line class="sec-line" x1="0" y1="5" x2="800" y2="5" />
  <line class="cyber-line" x1="0" y1="115" x2="800" y2="115" />
  <line class="sec-line" x1="0" y1="115" x2="800" y2="115" />

  <!-- Title / Logo (Aligned to Left) -->
  <g class="title-group" transform="translate(40, 60)">
    <text class="title-text" x="0" y="0">helu<tspan class="accent-text">cryptic</tspan></text>
    <text class="subtitle-text" x="3" y="22">PEER-TO-PEER ENCRYPTED MESSENGER</text>
  </g>

  <!-- Decorative Matrix Dots (Right Side) -->
  <g fill="#8B5CF6" opacity="0.2" transform="translate(700, 35)">
    <circle cx="0" cy="0" r="1.5" />
    <circle cx="15" cy="0" r="1.5" />
    <circle cx="30" cy="0" r="1.5" />
    <circle cx="0" cy="15" r="1.5" />
    <circle cx="15" cy="15" r="1.5" />
    <circle cx="30" cy="15" r="1.5" />
    <circle cx="0" cy="30" r="1.5" />
    <circle cx="15" cy="30" r="1.5" />
    <circle cx="30" cy="30" r="1.5" />
  </g>
</svg>
